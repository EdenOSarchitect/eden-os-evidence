name: eden-azure-application

on:
  push:
    paths:
      - 'experiments/eden-azure-application-001/**'
      - '.github/workflows/eden-azure-application.yml'
  pull_request:
    paths:
      - 'experiments/eden-azure-application-001/**'
      - '.github/workflows/eden-azure-application.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: |
          python -m py_compile experiments/eden-azure-application-001/azure_application_001.py
          python -m py_compile experiments/eden-azure-application-001/test_azure_application_001.py
      - name: Unit and concurrency tests
        run: python -m unittest experiments/eden-azure-application-001/test_azure_application_001.py
      - name: Isolated-process smoke benchmark
        run: |
          python experiments/eden-azure-application-001/azure_application_001.py \
            --requests 60 --iterations 500 --reuse 0.50 --concurrency 4 \
            --seed 260907 --environment CI_LOCAL --output-dir /tmp/eden-app
      - name: Enforce evidence and truth boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('/tmp/eden-app').glob('*.json'))
          assert len(files) == 1
          report = json.loads(files[0].read_text())
          expected_class = ('MEASURED_AZURE_VM_LOCAL_HTTP_HARNESS'
                            if report['host']['azure_hardware_signal']
                            else 'MEASURED_LOCAL_HTTP_HARNESS')
          assert report['evidence_class'] == expected_class
          assert report['comparison']['output_equivalence']
          assert report['comparison']['execution_accounting_valid']
          assert report['arms']['EDEN']['verification_failures'] == 0
          assert report['arms']['EDEN']['verification_attempts'] == 60
          assert report['arms']['EDEN']['verification_hit_attempts'] == report['arms']['EDEN']['reuse_hits']
          assert report['arms']['CONTROL']['application_payload_bytes'] == report['arms']['EDEN']['application_payload_bytes']
          assert 'actual Azure invoice savings' in report['truth_boundary']['not_claimed']
          assert 'statistical significance or confidence intervals from one run per arm' in report['truth_boundary']['not_claimed']
          print(json.dumps(report['comparison'], indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eden-azure-application-smoke-evidence
          path: /tmp/eden-app/
          if-no-files-found: error

  full-github-azure-runner:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Run full GitHub Azure benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record runner context
        run: |
          mkdir -p /tmp/eden-azure-full
          {
            date -u
            uname -a
            python --version
            nproc
            cat /etc/os-release
            cat /sys/class/dmi/id/sys_vendor 2>/dev/null || true
            cat /sys/class/dmi/id/product_name 2>/dev/null || true
            git rev-parse HEAD
          } | tee /tmp/eden-azure-full/RUNNER-CONTEXT.txt
      - name: Run full benchmark
        run: |
          python -u experiments/eden-azure-application-001/azure_application_001.py \
            --requests 10000 --iterations 30000 --reuse 0.50 --concurrency 8 \
            --seed 260907 --environment GITHUB_HOSTED_MICROSOFT_RUNNER \
            --output-dir /tmp/eden-azure-full | tee /tmp/eden-azure-full/TERMINAL-OUTPUT.txt
      - name: Enforce full-run acceptance gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('/tmp/eden-azure-full').glob('*.json'))
          assert len(files) == 1
          report = json.loads(files[0].read_text())
          assert report['configuration']['requests_per_arm'] == 10000
          assert report['configuration']['realized_reuse_fraction'] == 0.5
          assert report['comparison']['output_equivalence']
          assert report['comparison']['execution_accounting_valid']
          assert report['arms']['CONTROL']['full_executions'] == 10000
          assert report['arms']['CACHE']['full_executions'] == 5000
          assert report['arms']['EDEN']['full_executions'] == 5000
          assert report['arms']['EDEN']['executions_avoided_vs_control'] == 5000
          assert report['arms']['EDEN']['verification_hit_attempts'] == 5000
          assert report['arms']['EDEN']['verification_failures'] == 0
          assert report['arms']['CONTROL']['application_payload_bytes'] == report['arms']['CACHE']['application_payload_bytes'] == report['arms']['EDEN']['application_payload_bytes']
          print('FULL PILOT ACCEPTANCE: PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: eden-azure-application-full-github-runner
          path: /tmp/eden-azure-full/
          if-no-files-found: error
