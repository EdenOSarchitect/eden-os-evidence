name: marble-life-001

on:
  push:
    branches: [main, marble-life-001]
    paths:
      - 'marble/**'
      - '.github/workflows/marble-life-001.yml'
  pull_request:
    paths:
      - 'marble/**'
      - '.github/workflows/marble-life-001.yml'

permissions:
  contents: read

jobs:
  marble-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile reference implementation
        run: python -m py_compile marble/marble.py
      - name: Run Marble v2 regression suite
        run: python -m unittest discover -s marble/tests -p 'test_*.py' -v
